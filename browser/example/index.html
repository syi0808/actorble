<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Actorble Browser Examples</title>
    <link rel="stylesheet" href="/shared/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Actorble browser</p>
          <h1>Example projects</h1>
        </div>
      </header>

      <section class="example-index" aria-label="Example project list">
        <a class="example-link" href="/locator-inspector/">
          <span>01</span>
          <strong>Locator inspector</strong>
          <small>Resolve css, role, text, label, and testId locators.</small>
        </a>
        <a class="example-link" href="/action-playground/">
          <span>02</span>
          <strong>Action playground</strong>
          <small>Run typeInto and click against real DOM controls.</small>
        </a>
        <a class="example-link" href="/scenario-runner/">
          <span>03</span>
          <strong>Scenario runner</strong>
          <small>Execute ordered scenario steps and inspect trace output.</small>
        </a>
      </section>
    </main>
  </body>
</html>

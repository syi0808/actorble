<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Actorble Browser Examples</title>
    <link rel="stylesheet" href="/shared/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Actorble browser</p>
          <h1>Examples</h1>
        </div>
      </header>

      <section class="example-index" aria-label="Example project list">
        <a class="example-link" id="open-github-explorer" href="/github-explorer/">
          <span>01</span>
          <strong>GitHub explorer</strong>
          <small>Search a repository, open Issues, and inspect an issue with visible click-focus input.</small>
        </a>
        <a class="example-link" id="open-form-filling" href="/form-filling/">
          <span>02</span>
          <strong>Form filling</strong>
          <small>Fill a realistic request form, toggle a checkbox, and submit it.</small>
        </a>
        <a class="example-link" id="open-web-search" href="/web-search/">
          <span>03</span>
          <strong>Web search</strong>
          <small>Type a search query, load results, and open a result preview.</small>
        </a>
      </section>
    </main>
  </body>
</html>

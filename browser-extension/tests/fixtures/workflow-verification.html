<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Actorble Workflow Fixture</title>
  </head>
  <body>
    <main>
      <h1>Workflow verification</h1>
      <form>
        <label for="email">Email</label>
        <input
          id="email"
          data-testid="email-input"
          name="email"
          type="email"
          autocomplete="username"
        >
        <button id="submit" data-testid="submit-button" type="button">
          Sign in
        </button>
      </form>
    </main>
  </body>
</html>

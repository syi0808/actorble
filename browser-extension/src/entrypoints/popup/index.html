<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Actorble</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Actorble</p>
        <h1>Run Control</h1>
      </header>
      <section aria-label="Current tab status">
        <span id="status-dot" class="status-dot" data-tone="checking" aria-hidden="true"></span>
        <span id="status-message">Extension ready</span>
      </section>
      <label class="field">
        <span>Scenario</span>
        <select id="scenario-select" aria-label="Saved scenario">
          <option>Loading scenarios</option>
        </select>
      </label>
      <dl class="run-fields" aria-label="Run status">
        <div>
          <dt>Last run</dt>
          <dd id="last-run-status">No scenario selected</dd>
        </div>
        <div>
          <dt>Current run</dt>
          <dd id="current-run-status">No active run</dd>
        </div>
        <div>
          <dt>Recording</dt>
          <dd id="record-status">Not recording</dd>
        </div>
      </dl>
      <div class="actions" aria-label="Popup actions">
        <button id="record-button" type="button">Record</button>
        <button id="run-button" type="button" class="primary">Run</button>
        <button id="pause-resume-button" type="button">Pause</button>
        <button id="stop-button" type="button">Stop</button>
        <button id="panel-button" type="button">Panel</button>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

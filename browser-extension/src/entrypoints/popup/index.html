<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Actorble</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Actorble</p>
        <h1>Run Control</h1>
      </header>
      <section aria-label="Current tab status">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="status-message">Extension ready</span>
      </section>
      <div class="actions" aria-label="Popup actions">
        <button type="button" data-command="record">Record</button>
        <button type="button" data-command="run">Run</button>
        <button type="button" data-command="panel">Panel</button>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
